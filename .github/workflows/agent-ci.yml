name: Agent Copilot CI

on:
  pull_request:
    paths:
      - "agent/**"
      - "api/**"
      - "evals/**"
      - "tests/**"
      - "requirements-agent.txt"
      - ".github/workflows/agent-ci.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-agent.txt
      - name: Agent regression tests
        run: python -m pytest tests/test_agent_router.py tests/test_agent_service.py tests/test_golden_questions.py -vv --tb=long
      - run: python -c "from api.main import app; assert app.version == '1.0.0'"
      - run: python scripts/validate_powerbi_project.py
      - run: python scripts/audit_report_pages.py
